[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-soc-automation"
version = "0.1.0"
description = "A Python-based SOC alert processing and enrichment engine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Andrew D'Souza" }
]
dependencies = []

[project.scripts]
soc-automation = "soc_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]